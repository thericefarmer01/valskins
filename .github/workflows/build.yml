name: build

# Builds valskins.exe on a real Windows machine (PyInstaller can't cross-compile),
# attaches it to a GitHub Release, and publishes the download page.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.11.1
      - name: import check
        run: python -c "import app, valskins; print('imports ok')"
      - name: build exe
        run: pyinstaller --noconfirm --clean valskins.spec
      - name: smoke test
        # No Valorant on the runner, so demo mode is the only meaningful check:
        # it proves the bundle starts, the catalog loads and the server binds.
        run: |
          Start-Process -FilePath dist\valskins.exe -ArgumentList "--demo"
          Start-Sleep -Seconds 45
          $r = Invoke-RestMethod http://127.0.0.1:8787/api/state
          if ($r.players.Count -lt 10) { throw "demo roster missing: $($r.status) $($r.message)" }
          Write-Host "ok: $($r.status), $($r.players.Count) players"
          Stop-Process -Name valskins -Force
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: valskins-windows
          path: dist/valskins.exe
      - name: release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/valskins.exe
          generate_release_notes: true
          body: |
            Download `valskins.exe` below and run it on the PC you play on.

            Windows will show a SmartScreen warning because the build isn't code
            signed — More info → Run anyway. No installer, no login, no admin.

  pages:
    needs: windows
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    # Pages has to be switched on in Settings -> Pages -> Source: GitHub Actions.
    # Until it is, configure-pages fails - which shouldn't fail the build or send
    # a failure email, since the exe is what matters here.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - uses: actions/deploy-pages@v4
